version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: spam-classifier-backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./datasets:/app/datasets
      - ./backend:/app
    environment:
      - SECRET_KEY=super-secret-key-change-in-production
      - DATABASE_URL=sqlite:///./spam_classifier.db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: spam-classifier-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
